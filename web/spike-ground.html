<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ground Spike</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
  button { font-size: 18px; padding: 14px 20px; width: 100%; border-radius: 10px; border: 0; background: #2d7; color: #000; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  canvas { background: #000; max-width: 100%; }
  label { display: flex; gap: 4px; align-items: center; }
  input[type=number] { width: 64px; }
  #stats { white-space: pre; font-family: ui-monospace, monospace; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; color: #f88; max-height: 140px; overflow: auto; }
  video { display: none; }
  #lock { margin-top: 8px; background: #fc3; }
  #status { font-size: 22px; font-weight: 700; margin: 8px 0; }
  #status.inside { color: #3f6; }
  #tilt { background: #f93; color: #000; font-weight: 700; padding: 8px; border-radius: 8px; margin: 4px 0; }
  #status.outside-left, #status.outside-right, #status.lost { color: #f55; }
  #connect { margin-top: 8px; background: #39f; }
  #motors { display: flex; gap: 6px; margin: 8px 0; }
  #motors div { flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; background: #333; font-weight: 700; }
  #motors div.on { background: #fc3; color: #000; }
  #runs { border: 1px solid #444; border-radius: 10px; padding: 8px; margin: 8px 0; }
  #runs select, #runs button { font-size: 16px; padding: 10px; }
  #runs button { width: auto; flex: 1; }
  #runTable { width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; }
  #runTable td, #runTable th { border-bottom: 1px solid #333; padding: 2px 4px; text-align: right; }
  #csvOut { width: 100%; height: 120px; font-family: ui-monospace, monospace; font-size: 11px; }
</style>
</head>
<body>
<button id="start">Start (camera + motion)</button>
<button id="lock" hidden>Lock lane</button>
<button id="connect">Connect belt (BLE: LaneActuator)</button>
<div id="status"></div>
<div id="tilt" hidden></div>
<div id="motors"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>
<div id="runs">
  <div class="row">
    <select id="condition">
      <option value="belt">belt</option>
      <option value="audio">audio</option>
      <option value="none">no feedback</option>
    </select>
    <button id="runBtn">Start run</button>
  </div>
  <table id="runTable"></table>
  <div class="row">
    <button id="csvDownload">Download CSV</button>
    <button id="csvCopy">Copy CSV</button>
    <button id="csvShow">Show CSV</button>
    <button id="runsClear">Clear runs</button>
  </div>
  <textarea id="csvOut" hidden readonly></textarea>
</div>
<div class="row">
  <canvas id="view"></canvas>
  <canvas id="bev" width="240" height="320"></canvas>
</div>
<canvas id="hist" width="480" height="80"></canvas>
<div id="stats">loading OpenCV…</div>
<div class="row">
  <label>h(m) <input id="h" type="number" step="0.05" value="1.5"></label>
  <label>hfov <input id="hfov" type="number" step="1" value="53"></label>
  <label>Vmin <input id="vmin" type="number" step="5" value="180"></label>
  <label>Smax <input id="smax" type="number" step="5" value="60"></label>
  <label>lag(ms) <input id="lag" type="number" step="10" value="50"></label>
  <label>lane width(m) <input id="laneMin" type="number" step="0.05" value="0.6"> ~ <input id="laneMax" type="number" step="0.05" value="1.3"></label>
</div>
<div class="row">
  <label>manual β <input id="mbeta" type="number" step="1" value="65"></label>
  <label>manual γ <input id="mgamma" type="number" step="1" value="0"></label>
  <span>(used only when the device sends no orientation, e.g. a laptop webcam)</span>
</div>
<div id="log"></div>
<video id="video" playsinline muted></video>
<canvas id="proc" hidden></canvas>

<script async src="./vendor/opencv.js"></script>
<script type="module">
import { GroundLineDetector, DEFAULT_CONFIG } from './lane/detector.js';
import { AttitudeBuffer, upFromOrientation, deviceToCamera, groundToPixel } from './lane/ground.js';
import { LaneTracker, LaneStatus } from './lane/tracker.js';
import { LaneEstimator, yawRateFromMotion } from './control/estimator.js';
import { HapticController, Pattern } from './control/controller.js';
import { BeltLink, commandToLevels } from './control/protocol.js';
import { RunLogger, Condition } from './control/logger.js';
import { AudioCue } from './control/audio.js';

const $ = (id) => document.getElementById(id);
const logEl = $('log');
const log = (msg) => { logEl.textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + logEl.textContent; };
window.addEventListener('error', (e) => log(`error: ${e.message}`));
window.addEventListener('unhandledrejection', (e) => log(`rejection: ${e.reason}`));

// Resolves to { cv }. The OpenCV.js module is a thenable (Emscripten's Module.then), so it must never
// be awaited or returned from an async function: promise adoption calls its then() forever and
// freezes the page. Wrapping it in an object avoids that.
function loadCv() {
  return new Promise((resolve) => {
    const poll = () => {
      const cv = window.cv;
      if (!cv) return void setTimeout(poll, 50);
      if (cv.Mat) return resolve({ cv });
      if (typeof cv.then === 'function') return void cv.then((m) => resolve({ cv: m }));
      cv.onRuntimeInitialized = () => resolve({ cv });
    };
    poll();
  });
}

const attitude = new AttitudeBuffer();
let lastOrientation = null;
let upDevice = null;
window.addEventListener('deviceorientation', (e) => {
  if (e.beta == null) return;
  lastOrientation = { beta: e.beta, gamma: e.gamma, t: performance.now() };
  upDevice = upFromOrientation(e.beta, e.gamma);
  attitude.push(performance.now(), deviceToCamera(upDevice));
});

// Kalman prediction runs on every IMU sample; vision updates arrive per frame.
// iOS sometimes stops delivering motion events for up to ~2 s while the camera runs (measured in
// docs/phone-pipeline.md). When the IMU is older than IMU_STALE_MS, the frame loop predicts instead
// (without yaw rate), and vision measured with the stale attitude counts for less.
const IMU_STALE_MS = 100;
const estimator = new LaneEstimator();
const controller = new HapticController();
let lastMotionT = -Infinity;
let lastPredictT = null;
let yawRate = 0;
function predictTo(t, rate) {
  if (lastPredictT !== null && t > lastPredictT) estimator.predict((t - lastPredictT) / 1000, rate);
  lastPredictT = t;
}
window.addEventListener('devicemotion', (e) => {
  const t = performance.now();
  if (!e.rotationRate || !upDevice) return;
  yawRate = yawRateFromMotion(e.rotationRate, upDevice);
  lastMotionT = t;
  predictTo(t, yawRate);
});

const belt = new BeltLink({
  onLog: (m) => log(m),
  onStatus: (text, ok) => {
    $('connect').textContent = text;
    $('connect').style.background = ok ? '#2d7' : '#39f';
  },
});
if (navigator.bluetooth) belt.restore().catch((err) => log(`belt restore: ${err.message || err}`));
else $('connect').textContent = 'No Web Bluetooth (open in Bluefy)';
const audioCue = new AudioCue();

// Runs for the proof chart: same lane, walked under each condition; compare RMS of eY.
const logger = new RunLogger();
const cm1 = (m) => (Number.isFinite(m) ? (m * 100).toFixed(1) : '-');
function renderRuns() {
  const head = '<tr><th>#</th><th>cond</th><th>s</th><th>RMS cm</th><th>max cm</th><th>inside %</th><th>tracked %</th></tr>';
  $('runTable').innerHTML = head + logger.runs.map((r, i) => {
    const s = r.summary;
    return `<tr><td>${i + 1}</td><td>${r.condition}</td><td>${s.durationS.toFixed(0)}</td><td>${cm1(s.rmsEyKf)}</td>` +
      `<td>${cm1(s.maxAbsEy)}</td><td>${s.insidePct.toFixed(0)}</td><td>${s.trackedPct.toFixed(0)}</td></tr>`;
  }).join('');
}
renderRuns();
$('runBtn').onclick = () => {
  if (logger.recording) {
    const run = logger.stop();
    $('runBtn').textContent = 'Start run';
    $('condition').disabled = false;
    log(run ? `run saved: ${run.condition}, RMS ${cm1(run.summary.rmsEyKf)} cm` : 'run had no frames');
    renderRuns();
  } else {
    logger.start($('condition').value);
    $('runBtn').textContent = 'Stop run';
    $('condition').disabled = true;
  }
};
// Bluefy blocks download links; the iOS share sheet ("Save to Files") works there, as in
// record.html. Download links remain the fallback for browsers without file sharing.
$('csvDownload').textContent = 'Save CSV';
$('csvDownload').onclick = async () => {
  const name = `lane-runs-${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}.csv`;
  const file = new File([logger.toCsv()], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name });
      log(`CSV shared: ${name}`);
    } catch (err) {
      if (err.name !== 'AbortError') log(`share failed (${err.name} ${err.message}); use Copy CSV or Show CSV`);
    }
    return;
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
$('csvCopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(logger.toCsv());
    log('CSV copied');
  } catch (err) {
    log(`copy failed (${err.message || err}); use Show CSV`);
  }
};
$('csvShow').onclick = () => {
  $('csvOut').hidden = !$('csvOut').hidden;
  $('csvOut').value = logger.toCsv();
};
let clearArmed = false;
$('runsClear').onclick = () => {
  if (!clearArmed) {
    clearArmed = true;
    $('runsClear').textContent = 'Tap again to clear';
    setTimeout(() => { clearArmed = false; $('runsClear').textContent = 'Clear runs'; }, 3000);
    return;
  }
  logger.clear();
  renderRuns();
  clearArmed = false;
  $('runsClear').textContent = 'Clear runs';
};
$('connect').onclick = async () => {
  try {
    await belt.choose();
  } catch (err) {
    log(`belt connect failed: ${err.name || ''} ${err.message || err}`);
  }
};

const jitter = { left: [], right: [] };
function pushJitter(key, v) {
  const a = jitter[key];
  a.push(v);
  if (a.length > 60) a.shift();
}
const std = (a) => {
  if (a.length < 5) return NaN;
  const m = a.reduce((s, v) => s + v, 0) / a.length;
  return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length);
};

$('start').onclick = async () => {
  try {
    audioCue.start(); // must happen inside the tap, before any await
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      log(`orientation permission: ${await DeviceOrientationEvent.requestPermission()}`);
    }
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
      log(`motion permission: ${await DeviceMotionEvent.requestPermission()}`);
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    const video = $('video');
    video.srcObject = stream;
    await video.play();
    const { cv } = await loadCv();
    $('start').hidden = true;
    run(cv, video);
  } catch (err) {
    log(`start failed: ${err.name || ''} ${err.message || err}`);
  }
};

function run(cv, video) {
  const procWidth = DEFAULT_CONFIG.procWidth;
  const procHeight = Math.round((procWidth * video.videoHeight) / video.videoWidth);
  log(`video ${video.videoWidth}x${video.videoHeight} -> proc ${procWidth}x${procHeight}`);
  let detector = null;
  let detectorKey = '';
  const proc = $('proc');
  proc.width = procWidth;
  proc.height = procHeight;
  const pctx = proc.getContext('2d', { willReadFrequently: true });
  const view = $('view');
  view.width = procWidth * 2;
  view.height = procHeight * 2;
  const vctx = view.getContext('2d');
  let lastT = performance.now();
  let fps = 0;
  let prevHeading = 0;
  let latest = null;
  const tracker = new LaneTracker();
  $('lock').hidden = false;
  $('lock').onclick = () => {
    const ok = latest?.ok && tracker.lock(latest.peaks, latest.heading, latest.segments);
    if (ok) {
      controller.zone = 0;
      estimator.reset(tracker.last.eY, tracker.last.ePsi);
      lastPredictT = performance.now();
    }
    log(ok
      ? `locked: width ${(tracker.width * 100).toFixed(0)} cm`
      : `lock failed: need a line on each side of you, ${$('laneMin').value}-${$('laneMax').value} m apart, continuing over 2+ m`);
  };

  const frame = () => {
    const cfg = {
      procWidth,
      procHeight,
      cameraHeight: +$('h').value,
      hfovDeg: +$('hfov').value,
      whiteVMin: +$('vmin').value,
      whiteSMax: +$('smax').value,
    };
    const key = `${cfg.hfovDeg}|${cfg.cameraHeight}`;
    if (key !== detectorKey) {
      detector?.delete();
      detector = new GroundLineDetector(cv, cfg);
      detectorKey = key;
    }
    tracker.cfg.minWidth = +$('laneMin').value;
    tracker.cfg.maxWidth = +$('laneMax').value;
    // Height estimate from the line spacing: the locked lane's measured width, else the range middle.
    detector.cfg.laneWidth = tracker.locked ? tracker.width : (tracker.cfg.minWidth + tracker.cfg.maxWidth) / 2;
    if (cfg.whiteVMin !== detector.cfg.whiteVMin || cfg.whiteSMax !== detector.cfg.whiteSMax) {
      detector.setThresholds(cfg.whiteVMin, cfg.whiteSMax);
    }

    const tCapture = performance.now() - +$('lag').value;
    pctx.drawImage(video, 0, 0, procWidth, procHeight);
    const img = pctx.getImageData(0, 0, procWidth, procHeight);
    const up = lastOrientation
      ? attitude.at(tCapture)
      : deviceToCamera(upFromOrientation(+$('mbeta').value, +$('mgamma').value));

    const t0 = performance.now();
    const rgba = cv.matFromImageData(img);
    const res = detector.process(rgba, up, prevHeading);
    rgba.delete();
    latest = res;
    const lane = tracker.update(res.ok ? res.peaks : [], res.ok ? res.heading : tracker.heading, res.ok ? res.segments : []);
    // Once locked, the lane's own heading is the better prior than whatever the last frame found.
    if (tracker.locked && lane.status !== LaneStatus.LOST) prevHeading = lane.heading;
    else prevHeading = res.ok && res.peaks.length ? res.heading : 0;
    $('status').textContent = lane.status === LaneStatus.UNLOCKED
      ? 'not locked'
      : `${lane.status}   eY ${(lane.eY * 100).toFixed(0)} cm   eψ ${((lane.ePsi * 180) / Math.PI).toFixed(1)}°`;
    $('status').className = lane.status;
    // Before Lock: the lane a Lock would take now (drawn faint), or nothing if no lane is there.
    const candidate = !tracker.locked && res.ok ? tracker.candidate(res.segments) : null;
    if (!tracker.locked) $('status').textContent = candidate ? 'lane found - tap Lock lane' : 'no lane';
    // Chest mount is designed for ~70 degrees; much flatter only sees the feet, steeper the horizon.
    const beta = lastOrientation?.beta;
    $('tilt').hidden = beta == null || (beta >= 55 && beta <= 85);
    if (beta != null) $('tilt').textContent = `Tilt the phone to ~70° (now ${beta.toFixed(0)}°)`;

    // IMU stalled (or no gyro at all, e.g. a laptop webcam): keep the filter moving from here.
    const imuAgeMs = performance.now() - lastMotionT;
    const attitudeAgeMs = lastOrientation ? performance.now() - lastOrientation.t : Infinity;
    if (imuAgeMs > IMU_STALE_MS) predictTo(performance.now(), 0);
    let kf = null;
    if (lane.confidence > 0 && lane.status !== LaneStatus.LOST && lane.status !== LaneStatus.UNLOCKED) {
      const staleAttitude = lastOrientation && attitudeAgeMs > IMU_STALE_MS;
      kf = estimator.update(lane.eY, lane.ePsi, lane.confidence * (staleAttitude ? 0.4 : 1));
    }
    const state = estimator.initialized ? estimator.state : { eY: lane.eY ?? 0, vY: 0, ePsi: lane.ePsi ?? 0 };
    const cmd = controller.step(state, lane.status, lane.curvature ?? 0, performance.now(), !!lane.lowConfidence);
    // The belt only vibrates in belt runs; it still gets all-zero commands otherwise, so the board keeps a live link.
    const condition = $('condition').value;
    const levels = commandToLevels(cmd);
    belt.send(condition === Condition.BELT ? levels : [0, 0, 0, 0, 0]);
    audioCue.update(cmd, condition === Condition.AUDIO);
    showMotors(cmd, levels);
    const cue = cueText(cmd, tracker.locked, !!candidate);
    logger.record({
      status: lane.status,
      confidence: lane.confidence ?? 0,
      eY_raw_m: lane.eY,
      ePsi_raw_rad: lane.ePsi,
      curvature_1pm: lane.curvature,
      eY_kf_m: state.eY,
      vY_kf_mps: state.vY,
      ePsi_kf_rad: state.ePsi,
      lane_width_m: tracker.locked ? lane.width : '',
      matched: tracker.locked ? `${lane.matched.left ? 'L' : ''}${lane.matched.right ? 'R' : ''}` : '',
      u_m: cmd.u,
      zone: cmd.zone,
      cue: cue.replace(/[◀▶]/g, '').trim(), // plain ASCII so spreadsheets open the CSV cleanly
      motors: cmd.motors,
      period_ms: cmd.periodMs,
      L1: levels[0],
      L2: levels[1],
      L3: levels[2],
      L4: levels[3],
      L5: levels[4],
      imu_age_ms: Number.isFinite(imuAgeMs) ? Math.round(imuAgeMs) : '',
      fps,
    }, performance.now());
    const procMs = performance.now() - t0;

    const now = performance.now();
    fps = 0.9 * fps + 0.1 * (1000 / (now - lastT));
    lastT = now;

    const shown = tracker.locked ? lane : candidate && candidateLane(candidate, res.heading);
    drawView(vctx, img, detector, res, shown, cue, tracker.locked && lane.status !== LaneStatus.LOST ? controller.lastAim : null);
    drawBev($('bev'), res, shown);
    drawHist($('hist'), res);

    let left = null;
    let right = null;
    if (res.ok) {
      for (const p of res.peaks) {
        if (p.y < 0) left = p;
        else if (!right) right = p;
      }
      if (left) pushJitter('left', left.y);
      if (right) pushJitter('right', right.y);
    }
    const cm = (v) => (v == null || Number.isNaN(v) ? '  -  ' : (v * 100).toFixed(1).padStart(6));
    $('stats').textContent = [
      `fps ${fps.toFixed(1)}   process ${procMs.toFixed(1)} ms   mask px ${res.maskPixels ?? '-'}`,
      `orientation ${lastOrientation ? `β ${lastOrientation.beta.toFixed(1)} γ ${lastOrientation.gamma.toFixed(1)}` : 'none (manual)'}`,
      res.ok ? `peaks (cm) ${res.peaks.map((p) => cm(p.y)).join(' ')}` : `not ok: ${res.reason}`,
      `lane heading ${res.ok ? ((res.heading * 180) / Math.PI).toFixed(1) + '°' : '-'}  (+ = lane turns right of camera)`,
      `L ${cm(left?.y)}  R ${cm(right?.y)}  lane width ${left && right ? cm(right.y - left.y) : '  -  '}`,
      `jitter 2s (std, cm)  L ${cm(std(jitter.left))}  R ${cm(std(jitter.right))}   target < 10`,
      `h estimate ${res.heightEstimate ? res.heightEstimate.toFixed(2) + ' m' : '-'}`,
      tracker.locked
        ? `lane curve ${lane.curvature && Math.abs(lane.curvature) > 0.005 ? `R ${(1 / lane.curvature).toFixed(0)} m (${lane.curvature > 0 ? 'right' : 'left'})` : 'straight'}  L ${cm(lane.leftY)} R ${cm(lane.rightY)} width ${cm(lane.width)}  matched ${lane.matched.left ? 'L' : '-'}${lane.matched.right ? 'R' : '-'}  conf ${lane.confidence.toFixed(2)}`
        : 'lane: tap Lock lane while standing in the middle of your lane',
      estimator.initialized
        ? `kalman eY ${cm(state.eY)} vY ${cm(state.vY)}/s ePsi ${((state.ePsi * 180) / Math.PI).toFixed(1)}° ±${cm(state.sigmaY)}  ${kf && !kf.accepted ? 'REJECTED outlier' : ''}`
        : 'kalman: waiting for lock',
      `control u ${cm(cmd.u)}  zone ${cmd.zone}  period ${cmd.periodMs} ms  levels [${levels.join(' ')}]`,
      `imu age ${Number.isFinite(imuAgeMs) ? imuAgeMs.toFixed(0) + ' ms' : 'none'}  yaw rate ${((yawRate * 180) / Math.PI).toFixed(0)}°/s  belt ${belt.connected ? `on, rtt ${belt.rttMs?.toFixed(0) ?? '-'} ms, skipped ${belt.stats.skipped}` : 'off'}`,
    ].join('\n');

    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(frame);
    else requestAnimationFrame(frame);
  };
  frame();
}

// Mirrors the belt on screen: each box shows its motor's level and blinks with the 60 ms pulses
// the firmware produces for that level.
function showMotors(cmd, levels) {
  const on = cmd.pattern !== Pattern.OFF && cmd.periodMs > 0 && performance.now() % cmd.periodMs < 60;
  [...$('motors').children].forEach((el, i) => {
    el.textContent = levels[i] ? `M${i + 1} · ${levels[i]}` : `M${i + 1}`;
    el.classList.toggle('on', on && levels[i] > 0);
  });
}

// Point on the line at perpendicular offset y, distance t along the lane heading.
const alongLane = (t, y, heading) => [
  t * Math.cos(heading) - y * Math.sin(heading),
  t * Math.sin(heading) + y * Math.cos(heading),
];

// A Lock preview in the same shape the tracker outputs, for drawing.
function candidateLane(cand, heading) {
  return { status: 'candidate', heading, width: cand.width, polylines: cand.polylines };
}

// Big text over the camera view, like the reference's "Straight".
function cueText(cmd, locked, found) {
  if (!locked) return found ? 'LANE FOUND' : 'NO LANE';
  if (cmd.pattern === Pattern.STOP) return 'STOP';
  if (cmd.pattern === Pattern.HEARTBEAT) return 'STRAIGHT';
  if (cmd.pattern === Pattern.STEER) return cmd.motors & 0b00011 ? '◀ LEFT' : 'RIGHT ▶';
  return '';
}

// The lane as found segment by segment: each line is the chain of points the sliding window
// matched (joined short straight pieces), and the space between the two lines is filled, as in
// the ideal case. A side with no chain is drawn one lane width from the other side.
function drawLane(ctx, toScreen, lane) {
  if (!lane || !lane.polylines) return;
  let { left, right } = lane.polylines;
  if (!left.length && !right.length) return;
  if (!left.length) left = right.map((p) => ({ x: p.x, y: p.y - lane.width }));
  if (!right.length) right = left.map((p) => ({ x: p.x, y: p.y + lane.width }));
  // Reach toward the runner's feet and a little past the last segment, along each line's own end
  // direction, so the fill covers the whole lane in view like the ideal case.
  const extend = (chain) => {
    if (chain.length < 2) return chain;
    const [a0, a1] = chain;
    const [z1, z0] = chain.slice(-2);
    const s0 = (a1.y - a0.y) / (a1.x - a0.x);
    const s1 = (z0.y - z1.y) / (z0.x - z1.x);
    return [{ x: 0.5, y: a0.y - s0 * (a0.x - 0.5) }, ...chain, { x: z0.x + 0.5, y: z0.y + s1 * 0.5 }];
  };
  const toPts = (chain) => extend(chain).map((p) => toScreen(...alongLane(p.x, p.y, lane.heading))).filter(Boolean);
  const l = toPts(left);
  const r = toPts(right);
  const preview = lane.status === 'candidate';
  const outside = lane.status === LaneStatus.OUTSIDE_LEFT || lane.status === LaneStatus.OUTSIDE_RIGHT;
  if (l.length && r.length) {
    ctx.fillStyle = preview ? 'rgba(0, 230, 30, 0.15)' : outside ? 'rgba(255, 60, 60, 0.35)' : 'rgba(0, 230, 30, 0.35)';
    ctx.beginPath();
    [...l, ...[...r].reverse()].forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = '#ff3';
  ctx.lineWidth = preview ? 2 : 5;
  ctx.setLineDash(preview ? [6, 6] : []);
  for (const pts of [l, r]) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // The reference line the PD controller follows: the fitted centerline (eY and eψ are measured
  // against it at the runner). Before Lock, the middle of the two found lines.
  const xs = [];
  for (let x = 0.5; x <= Math.max(...left.map((p) => p.x), ...right.map((p) => p.x)) + 0.5; x += 0.25) xs.push(x);
  const { shape } = lane;
  const centerY = shape
    ? (x) => shape.a + shape.b * x + shape.c * x * x
    : (x) => (interp(left, x) + interp(right, x)) / 2;
  const center = xs.map((x) => toScreen(...alongLane(x, centerY(x), lane.heading))).filter(Boolean);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = preview ? 2 : 3;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  center.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.stroke();
  ctx.setLineDash([]);
  if (preview) return;

  // The runner's own straight-ahead path (camera ground frame, y = 0). Its gap to the centerline is
  // the error the belt is correcting.
  const path = [0.3, 1, 2, 3].map((x) => toScreen(x, 0)).filter(Boolean);
  ctx.strokeStyle = '#3cf';
  ctx.lineWidth = 3;
  ctx.beginPath();
  path.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.stroke();
}

// Linear interpolation / end extrapolation of a chain's y at distance x.
function interp(chain, x) {
  if (chain.length === 1) return chain[0].y;
  let i = 1;
  while (i < chain.length - 1 && chain[i].x < x) i++;
  const a = chain[i - 1];
  const b = chain[i];
  return a.y + ((b.y - a.y) * (x - a.x)) / (b.x - a.x);
}

function drawView(ctx, img, detector, res, lane, cue, aim) {
  const s = 2;
  const tmp = new OffscreenCanvas(img.width, img.height);
  const tctx = tmp.getContext('2d');
  const mask = detector.mask.data;
  for (let i = 0; i < mask.length; i++) {
    if (mask[i]) {
      img.data[4 * i] = 255;
      img.data[4 * i + 1] = 40;
      img.data[4 * i + 2] = 40;
    }
  }
  tctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0, img.width * s, img.height * s);
  if (res.ok) {
    drawLane(ctx, (x, y) => {
      const px = groundToPixel(x, y, detector.K, res.basis, detector.cfg.cameraHeight);
      return px && [px[0] * s, px[1] * s];
    }, lane);
    // Pure-pursuit aim point (orange): the belt steers the runner toward it.
    const a = aim && groundToPixel(aim.x, aim.y, detector.K, res.basis, detector.cfg.cameraHeight);
    if (a) {
      ctx.fillStyle = '#f80';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(a[0] * s, a[1] * s, 9, 0, 2 * Math.PI);
      ctx.fill();
      ctx.stroke();
    }
  }
  if (cue) {
    ctx.font = `bold ${Math.round(ctx.canvas.width / 9)}px -apple-system, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillStyle = cue === 'STOP' || cue === 'NO LANE' ? '#f55' : '#fff';
    ctx.strokeText(cue, ctx.canvas.width / 2, ctx.canvas.height * 0.12);
    ctx.fillText(cue, ctx.canvas.width / 2, ctx.canvas.height * 0.12);
  }
}

// Bird's-eye view: forward 0..5m bottom to top, lateral -3..3m. Red dots: line pixels on the
// ground; white ticks: line peaks found per segment; the lane as in drawLane.
function drawBev(canvas, res, lane) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const sx = (y) => W / 2 + (y / 3) * (W / 2);
  const sy = (x) => H - (x / 5) * H;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#333';
  ctx.fillRect(0, sy(4), W, sy(1) - sy(4));
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(sx(0), sy(0) - 4, 4, 0, 2 * Math.PI);
  ctx.fill();
  drawLane(ctx, (x, y) => [sx(y), sy(x)], lane);
  if (!res.ok) return;
  ctx.fillStyle = '#f55';
  const { points, count } = res.ground;
  for (let i = 0; i < count; i++) ctx.fillRect(sx(points[2 * i + 1]), sy(points[2 * i]), 1.5, 1.5);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  for (const seg of res.segments) {
    for (const p of seg.peaks) {
      const [x0, y0] = alongLane(seg.x - 0.15, p.y, res.heading);
      const [x1, y1] = alongLane(seg.x + 0.15, p.y, res.heading);
      ctx.beginPath();
      ctx.moveTo(sx(y0), sy(x0));
      ctx.lineTo(sx(y1), sy(x1));
      ctx.stroke();
    }
  }
}

function drawHist(canvas, res) {
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!res.ok) return;
  const h = res.hist.hist;
  let max = 1;
  for (const v of h) max = Math.max(max, v);
  ctx.fillStyle = '#f55';
  const bw = canvas.width / h.length;
  for (let i = 0; i < h.length; i++) {
    const bh = (h[i] / max) * canvas.height;
    ctx.fillRect(i * bw, canvas.height - bh, Math.max(1, bw), bh);
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(canvas.width / 2, 0, 1, canvas.height);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch((err) => log(`offline cache unavailable: ${err.message || err}`));
}

loadCv().then(() => {
  if (!$('start').hidden) $('stats').textContent = 'OpenCV ready. Tap Start.';
  // ?autostart: laptop development and headless smoke tests (iOS still needs a real tap for permissions).
  if (new URLSearchParams(location.search).has('autostart')) $('start').click();
});
